    <title>Abubakr Lukman-Uthman — Backend Engineer</title>

    <!-- Boot loader: plain CSS, no dependency on Tailwind or the JS bundle,
         so it paints the instant the HTML parses, not after fonts or React. -->
    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0f1a;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      #boot-loader.boot-hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .boot-inner {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .boot-line {
        margin: 0;
        color: #8891a6;
        font-size: 13px;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }
      .boot-user,
      .boot-host {
        color: #2ecbb0;
      }
      .boot-at,
      .boot-colon {
        color: #4b5568;
      }
      .boot-cmd {
        margin-left: 6px;
        color: #e7ebf3;
      }
      .boot-cursor {
        display: inline-block;
        width: 8px;
        height: 15px;
        margin-left: 3px;
        vertical-align: -3px;
        background: #ffb020;
        animation: boot-blink 1s step-end infinite;
      }
      .boot-track {
        position: relative;
        width: 180px;
        height: 2px;
        overflow: hidden;
        background: #1c2333;
        border-radius: 2px;
      }
      .boot-sweep {
        position: absolute;
        top: 0;
        left: -40%;
        height: 100%;
        width: 40%;
        background: linear-gradient(90deg, transparent, #ffb020, #2ecbb0, transparent);
        animation: boot-sweep 1.1s ease-in-out infinite;
      }
      @keyframes boot-blink {
        50% { opacity: 0; }
      }
      @keyframes boot-sweep {
        0% { left: -40%; }
        100% { left: 100%; }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-cursor, .boot-sweep { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <script>window.__bootStart = Date.now();</script>

    <div id="boot-loader" aria-hidden="true">
      <div class="boot-inner">
        <p class="boot-line">
          <span class="boot-user">abubakr</span><span class="boot-at">@</span><span class="boot-host">systems</span><span class="boot-colon">:~$</span>
          <span class="boot-cmd">initializing</span><span class="boot-cursor"></span>
        </p>
        <div class="boot-track"><div class="boot-sweep"></div></div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
